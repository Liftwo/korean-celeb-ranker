<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Korean Celebrity Ranker</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
            background-color: #f5f5f5;
        }
        .container {
            text-align: center;
        }
        h1 {
            color: #333;
            margin-bottom: 30px;
        }
        .celeb-container {
            display: flex;
            justify-content: space-around;
            margin-bottom: 30px;
            flex-wrap: wrap;
            gap: 20px;
        }
        .celeb-card {
            background: white;
            border-radius: 10px;
            padding: 15px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            cursor: pointer;
            transition: transform 0.2s;
            width: 300px;
            position: relative;
        }
        .celeb-card:hover {
            transform: translateY(-5px);
        }
        .celeb-image {
            width: 100%;
            height: 400px;
            object-fit: cover;
            border-radius: 5px;
            margin-bottom: 10px;
        }
        .celeb-name {
            font-size: 1.2em;
            color: #333;
            margin: 10px 0;
        }
        .round-counter {
            font-size: 1.2em;
            color: #666;
            margin-bottom: 20px;
        }
        .final-result {
            display: none;
            background: white;
            padding: 20px;
            border-radius: 10px;
            margin-top: 20px;
        }
        .reaction {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0);
            font-size: 100px;
            z-index: 10;
            text-shadow: 0 0 20px rgba(0,0,0,0.5);
            transition: transform 0.3s ease-out;
            pointer-events: none;
        }
        .reaction.show {
            transform: translate(-50%, -50%) scale(1);
        }
        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.3);
            opacity: 0;
            transition: opacity 0.3s;
            border-radius: 5px;
        }
        .overlay.show {
            opacity: 1;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Choose Your Favorite Korean Celebrity</h1>
        <div class="round-counter">Round: <span id="roundNumber">1</span>/25</div>
        <div class="celeb-container" id="celebContainer"></div>
        <div class="final-result" id="finalResult"></div>
    </div>

    <script>
        let round = 1;
        let winner = null;
        let currentPair = [];
        let isAnimating = false;

        async function loadNewPair(winnerId = null, loserId = null) {
            try {
                const url = winnerId !== null ? `/get-pair/${winnerId}/${loserId}` : '/get-pair/0/0';
                const response = await fetch(url);
                const data = await response.json();
                
                // Check if we have a winner
                if (data.winner || data.celebs.length === 1) {
                    winner = data.celebs[0];
                    showFinalResult();
                    return;
                }
                
                currentPair = data.celebs;
                displayCelebs(data.celebs);
            } catch (error) {
                console.error('Error:', error);
            }
        }

        function displayCelebs(celebs) {
            const container = document.getElementById('celebContainer');
            container.innerHTML = '';
            
            celebs.forEach(celeb => {
                const card = document.createElement('div');
                card.className = 'celeb-card';
                card.innerHTML = `
                    <div class="overlay"></div>
                    <div class="reaction heart">❤️</div>
                    <div class="reaction cry">😭</div>
                    <img src="${celeb.image}" alt="${celeb.name}" class="celeb-image">
                    <div class="celeb-name">${celeb.name}</div>
                `;
                card.onclick = () => !isAnimating && selectCeleb(celeb, card);
                container.appendChild(card);
            });
        }

        async function selectCeleb(selectedCeleb, selectedCard) {
            if (isAnimating) return;
            isAnimating = true;

            // Find the other card (loser)
            const container = document.getElementById('celebContainer');
            const cards = container.getElementsByClassName('celeb-card');
            const loserCard = Array.from(cards).find(card => 
                card.querySelector('.celeb-name').textContent !== selectedCeleb.name
            );

            // Show reactions
            selectedCard.querySelector('.heart').classList.add('show');
            selectedCard.querySelector('.overlay').classList.add('show');
            loserCard.querySelector('.cry').classList.add('show');
            loserCard.querySelector('.overlay').classList.add('show');

            // Wait for animation
            await new Promise(resolve => setTimeout(resolve, 1000));

            winner = selectedCeleb;
            round++;
            document.getElementById('roundNumber').textContent = round;

            // Find the loser from the current pair
            const loser = currentPair.find(celeb => celeb.id !== selectedCeleb.id);

            if (round <= 25) {
                loadNewPair(selectedCeleb.id, loser.id);
            } else {
                showFinalResult();
            }

            isAnimating = false;
        }

        function showFinalResult() {
            const container = document.getElementById('celebContainer');
            const finalResult = document.getElementById('finalResult');
            const roundCounter = document.querySelector('.round-counter');
            
            container.style.display = 'none';
            roundCounter.style.display = 'none';
            finalResult.style.display = 'block';
            finalResult.innerHTML = `
                <h2>Your Favorite Korean Celebrity Is:</h2>
                <div class="celeb-card">
                    <img src="${winner.image}" alt="${winner.name}" class="celeb-image">
                    <div class="celeb-name">${winner.name}</div>
                    <div class="reaction heart show">❤️</div>
                </div>
                <button onclick="location.reload()" style="margin-top: 20px; padding: 12px 24px; font-size: 1.1em; cursor: pointer; border: none; border-radius: 8px; background: linear-gradient(135deg, #ff7eb3, #ff758c); color: white; box-shadow: 2px 2px 10px rgba(0, 0, 0, 0.2); transition: 0.3s;">
                    Start Over
                </button>
            `;
        }

        // Start the game
        loadNewPair();
    </script>
</body>
</html>
